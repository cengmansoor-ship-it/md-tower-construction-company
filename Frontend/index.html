<!doctype html>
<html lang="ps" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>د سیستم اداره</title>
    <style>
      .welcome-copy > span,
      .welcome-kicker {
        display: none !important;
        visibility: hidden !important;
        position: absolute !important;
        width: 0 !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (() => {
        const fallbackTitle = "د سیستم اداره";
        const storageKey = "arabian-d-company-title";
        const applyTitle = (name) => {
          const title = String(name || "").trim() || fallbackTitle;
          document.title = title;
          try {
            window.localStorage.setItem(storageKey, title);
          } catch {}
        };

        try {
          const savedTitle = window.localStorage.getItem(storageKey);
          if (savedTitle) applyTitle(savedTitle);
        } catch {}

        fetch(`/api/settings/public?title=${Date.now()}`, { cache: "no-store", credentials: "include" })
          .then((response) => (response.ok ? response.json() : null))
          .then((settings) => {
            if (settings?.companyName) applyTitle(settings.companyName);
          })
          .catch(() => {});

        const removeWelcomeBrandBadges = () => {
          if (!window.location.pathname.includes("/welcome")) return;
          document.querySelectorAll(".welcome-copy > span, .welcome-kicker").forEach((element) => element.remove());
        };

        document.addEventListener("DOMContentLoaded", () => {
          removeWelcomeBrandBadges();
          new MutationObserver(removeWelcomeBrandBadges).observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
